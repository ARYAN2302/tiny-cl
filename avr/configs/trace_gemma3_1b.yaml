# AVR on TRACE, Gemma 3 1B — newest Google small model.
# Cross-family validation: third model family (Google, vs Liquid AI + Qwen).

model:
  id: google/gemma-3-1b-it
  lora_targets: [q_proj, k_proj, v_proj, o_proj]
  lora_rank: 32
  lora_alpha: 32
  lora_dropout: 0.05

stream:
  benchmark: trace
  tasks: [C-STANCE, FOMC, NumGLUE-cm, NumGLUE-ds]
  seed: 42

learn:
  method: sft
  epochs: 3
  lr: 0.0002
  weight_decay: 0.01
  max_grad_norm: 1.0
  batch_size: 8
  context_length: 512

verify:
  detector: ppl_ratio
  threshold: 1.15
  threshold_mode: fixed
  probe_samples: 200

repair:
  operator: snapshot_interp
  alpha: 0.1
  alpha_decay: sqrt
  max_steps: 100
  max_steps_mode: adaptive

oracle: noop
consolidator: noop

output:
  results_dir: results
