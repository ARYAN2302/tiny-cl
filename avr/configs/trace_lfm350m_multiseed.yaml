# AVR on TRACE, LFM2.5-350M, multi-seed. Run with --seed 42, 123, 7.
# Use: avr train configs/trace_lfm350m_multiseed.yaml --seed 42
#      avr train configs/trace_lfm350m_multiseed.yaml --seed 123
#      avr train configs/trace_lfm350m_multiseed.yaml --seed 7

model:
  id: LiquidAI/LFM2.5-350M
  lora_targets: [in_proj, out_proj]
  lora_rank: 32
  lora_alpha: 32
  lora_dropout: 0.05

stream:
  benchmark: trace
  tasks: [C-STANCE, FOMC, NumGLUE-cm, NumGLUE-ds]
  seed: 42  # overridden by --seed flag

learn:
  method: sft
  epochs: 3
  lr: 0.0002
  weight_decay: 0.01
  max_grad_norm: 1.0
  batch_size: 8
  context_length: 512

verify:
  detector: ppl_ratio
  threshold: 1.15
  threshold_mode: fixed
  probe_samples: 200

repair:
  operator: snapshot_interp
  alpha: 0.1
  alpha_decay: sqrt
  max_steps: 100
  max_steps_mode: adaptive

oracle: noop
consolidator: noop

output:
  results_dir: results
