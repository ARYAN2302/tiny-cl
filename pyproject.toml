[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avr-cl"
version = "0.1.0"
description = "Detect and repair catastrophic forgetting in sequential LLM fine-tuning."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Aryan Thakur"}]
dependencies = [
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.20",
    "datasets>=2.14",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.scripts]
avr = "avr.cli:main"

[tool.setuptools.packages.find]
include = ["avr*"]
